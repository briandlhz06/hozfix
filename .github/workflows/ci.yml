name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Help
        run: python -m hozfix --help
      - name: Pytest
        run: pytest -q
      - name: Smoke
        run: python -m hozfix --from-json examples/sample-input.json -q --md /tmp/hozfix.md --sh /tmp/hozfix.sh
